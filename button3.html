<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Buttons with Sub-options</title>
  <style>
    *{
        background-color:black;

          background-size: cover;  
    }
    .filter-buttons {
      display:inline-flex;
      gap: 100px;
      position: relative;
    }
    .filter-button {
      padding: 10px 20px;
      font-size: 17px;
      cursor: pointer;
      background-color: gold;
      color: black;
      border: none;
      border-radius: 5px;
      transition: background-color 0.3s;
      position: relative;
      margin-top: 250px;
    }
    .filter-button:hover {
      background-color:rgb(255, 255, 225);
    }
    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #f9f9f9;
      min-width: 160px;
      
      z-index: 1;

      border-radius: 5px;
      margin-top: 10px;
    }
    .dropdown-content a {
      color: gold;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      font-size: 20px;
    }
    .dropdown-content a:hover {
      
    

          background-size: cover;
    }
    .filter-button:focus + .dropdown-content, 
    .dropdown-content:hover {
      display: block;
    }
  </style>
</head>
<body align="center">



  <div class="filter-buttons">
    <div class="dropdown">
      <div id="dropdownAZ" class="dropdown-content">
       </div>
    </div>  

  <div class="dropdown">
    <button class="filter-button" onclick="toggleDropdown('dropdownGenre')">Movie Genre</button>
    <div id="dropdownGenre" class="dropdown-content">
      <a href="actionholly.html" onclick="filterGenre('Action')">Action</a>
      <a href="comedyholly.html" onclick="filterGenre('Comedy')">Comedy</a>
      <a href="dramaholly.html" onclick="filterGenre('Drama')">Drama</a>
    </div>
  </div>

  <div class="dropdown">
    <button class="filter-button" onclick="toggleDropdown('dropdownHeroes')">Heroes</button>
    <div id="dropdownHeroes" class="dropdown-content">
      <a href="tom cruise.html" onclick="filterHeroes('Prabhas')">TOM CRUISE</a>
      <a href="robertdowney.html" onclick="filterHeroes('Mahesh Babu')">ROBERT DOWNEY</a>
         </div>
  </div>

  <div class="dropdown">
    <button class="filter-button" onclick="toggleDropdown('dropdownDirectors')">Directors</button>
    <div id="dropdownDirectors" class="dropdown-content">
      <a href="james cameron.html" onclick="filterDirectors('S.S.Rajamouli')">JAMES CAMERON</a>
      <a href="nolan.html" onclick="filterDirectors('Trivikram Srinivas')">NOLAN</a>
      </div>
  </div>
</div>

<script>
  function toggleDropdown(id) {
    const dropdown = document.getElementById(id);
    dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
  }

  function filterAZ(option) {
    console.log("Filtering A-Z by:", option);
    // Add filter functionality here
  }

  function filterGenre(option) {
    console.log("Filtering by Genre:", option);
    // Add filter functionality here
  }

  function filterHeroes(option) {
    console.log("Filtering by Hero:", option);
    // Add filter functionality here
  }

  function filterDirectors(option) {
    console.log("Filtering by Director:", option);
    // Add filter functionality here
  }

  // Close dropdowns if clicked outside
  window.onclick = function(event) {
    if (!event.target.matches('.filter-button')) {
      document.querySelectorAll('.dropdown-content').forEach(function(dropdown) {
        dropdown.style.display = 'none';
      });
    }
  }
</script>

</body>
</html>
